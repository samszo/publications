<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="540" height="220" font-family="Georgia, serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="540" height="220" fill="#fff"/>

  <!-- Entrées (prémisses) -->
  <text x="22" y="56" font-size="18" font-style="italic">A</text>
  <text x="22" y="181" font-size="18" font-style="italic">B</text>

  <g fill="none" stroke="#000" stroke-width="2.5">
    <!-- A vers ET, et dérivation vers OU -->
    <line x1="42" y1="50" x2="148" y2="50" marker-end="url(#f)"/>
    <polyline points="72,50 72,145 158,145" marker-end="url(#f)"/>
    <!-- B vers OU, et dérivation vers ET -->
    <line x1="42" y1="175" x2="158" y2="175" marker-end="url(#f)"/>
    <polyline points="104,175 104,80 148,80" marker-end="url(#f)"/>

    <!-- Sorties intermédiaires vers le OU final -->
    <polyline points="225,65 270,65 270,95 350,95" marker-end="url(#f)"/>
    <polyline points="235,160 290,160 290,145 350,145" marker-end="url(#f)"/>

    <!-- Conclusion -->
    <line x1="440" y1="120" x2="505" y2="120" marker-end="url(#f)"/>
  </g>

  <!-- Jonctions -->
  <circle cx="72" cy="50" r="4" fill="#000"/>
  <circle cx="104" cy="175" r="4" fill="#000"/>

  <!-- Portes logiques -->
  <g fill="#fff" stroke="#000" stroke-width="3" stroke-linejoin="round">
    <!-- ET -->
    <path d="M150,30 H190 A35,35 0 0 1 190,100 H150 Z"/>
    <!-- OU -->
    <path d="M150,125 Q172,160 150,195 Q205,195 235,160 Q205,125 150,125 Z"/>
    <!-- OU final -->
    <path d="M340,75 Q364,120 340,165 Q405,165 440,120 Q405,75 340,75 Z"/>
  </g>

  <!-- Symboles des opérations -->
  <text x="178" y="72" font-size="18" text-anchor="middle">∧</text>
  <text x="190" y="167" font-size="18" text-anchor="middle">∨</text>
  <text x="390" y="127" font-size="18" text-anchor="middle">∨</text>

  <!-- Conclusion -->
  <text x="512" y="126" font-size="18" font-style="italic">C</text>
</svg>
